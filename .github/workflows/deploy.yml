name: Test and deploy

# Every push to main deploys to Cloudflare Pages (production).
# Pull requests from this repository get a preview deployment.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN   – API token with "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  – the Cloudflare account that owns the Pages project
# The Pages project "krash" must exist once:
#   npx wrangler pages project create krash --production-branch main

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit and integration tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        # Secrets are not available to pull requests from forks; skip those.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=krash --branch=${{ github.head_ref || github.ref_name }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
